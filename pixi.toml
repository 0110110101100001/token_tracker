# Environment for the Claude cost meter.
#
# Only widget.py needs anything from here: it imports gi (PyGObject) and
# requires GTK 3. Everything else -- tally.py, calibrate.py, cost_meter/ and the
# tests -- is standard library only. The environment still owns every entry
# point anyway, so there is exactly one interpreter to reason about and the
# documented commands are identical on every machine.

[workspace]
name = "token-calculator"
version = "0.1.0"
description = "Always-on-top GTK panel showing what Claude Code work costs"
channels = ["conda-forge"]
# One lock file covers both platforms; pixi solves them together. Adding
# linux-aarch64 or an osx-* target is a one-line change once somebody has
# actually solved and smoke-tested it there.
platforms = ["linux-64", "win-64"]

[dependencies]
# The interpreter the project was developed against, and the version pygobject
# publishes py314 builds for -- on win-64 as well as linux-64.
python = "3.14.*"
pygobject = ">=3.56"
gtk3 = ">=3.24"
# GTK 3 needs these at runtime, not merely to build against: without an icon
# theme plus an SVG loader it renders missing-image placeholders.
adwaita-icon-theme = "*"
librsvg = "*"

[target.linux-64.dependencies]
# Without the desktop schemas GTK fails looking up org.gtk.Settings. There is no
# win-64 build and none is needed: gtk3 ships the org.gtk.* schemas itself, and
# GDK's win32 backend reads desktop settings from the registry, not GSettings.
gsettings-desktop-schemas = "*"

[tasks]
# The full check: unit tests, a real GTK render, and a proof that a genuine
# fault is logged rather than escaping. This is the task both the project
# convention and the PostToolUse hook look for.
#
# Python rather than bash so Windows runs the same check as Linux: mktemp, trap
# and the test-for-a-display all have portable equivalents in the standard
# library, and a second hand-written shell twin would drift.
smoke = "python smoke.py"

# Unit tests alone, against a fresh throwaway COST_METER_HOME so a run never
# reads or writes the real ledger. run_tests.py owns that temp directory.
test = "python run_tests.py"

# One incremental recount. This is what the Stop hook runs, via hooks/tally.sh
# or hooks/tally.cmd. Reads the hook payload on stdin; `pixi run tally` with
# stdin at /dev/null (or NUL) forces a recount by hand.
tally = "python tally.py"

# Bring the panel up unless one is already running. This is what the
# SessionStart hook runs, via launch_widget.sh or launch_widget.cmd.
launch = "python -m cost_meter.launch"

# Calibration. Pass flags after a bare `--` so pixi does not read them as its
# own: pixi run calibrate -- --5h 42
calibrate = "python calibrate.py"

# Register the Stop and SessionStart hooks in ~/.claude/settings.json.
install-hooks = "python -m cost_meter.install"

[target.linux-64.tasks]
# The panel in the foreground.
#
# GDK_BACKEND lives here rather than in run_widget.sh so there is one owner of
# it: a Wayland client may not position itself or raise itself above other
# windows, which is exactly what this panel needs, and under XWayland both work.
# run_widget.sh calls this task, so anything launched from outside the
# environment -- the SessionStart hook, an autostart entry -- gets the same
# setting without repeating it.
widget = { cmd = "python widget.py", env = { GDK_BACKEND = "x11" } }

[target.win-64.tasks]
# The same panel, with no GDK_BACKEND override. GDK's only backend here is
# win32; forcing x11 would leave the panel with no display to open at all.
#
# pythonw, not python, and this is load-bearing rather than tidiness. The
# SessionStart hook spawns the panel with DETACHED_PROCESS, which gives it no
# console to inherit -- and Windows answers that by allocating a brand new
# console for any console-subsystem program, so `python` would put a black
# window and a conhost.exe on screen beside the panel for its whole life.
# pythonw is the same interpreter built as a GUI-subsystem binary, so there is
# nothing for Windows to allocate. It also discards stdout and stderr, which
# costs nothing here: widget.py's only diagnostic path is --selftest, and
# smoke.py runs that through sys.executable rather than through this task.
widget = "pythonw widget.py"
